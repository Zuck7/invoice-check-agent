<title>Invoice Exception Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root{
    --ground:#F4F6F2; --surface:#FFFFFF; --surface-2:#EAEEE7;
    --ink:#14181A; --ink-2:#414B48; --muted:#737C78; --rule:#D7DCD2;
    --accent:#1D5A72; --accent-soft:#E0EDF2;
    --high:#A33024; --med:#8A5A12; --low:#3C6B52;
    --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
    --f-body:'Source Serif 4',Georgia,serif;
    --f-mono:'IBM Plex Mono',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0F1211; --surface:#171B1A; --surface-2:#1F2523;
    --ink:#E9ECE7; --ink-2:#BAC2BE; --muted:#8B948F; --rule:#2B312F;
    --accent:#74B8D4; --accent-soft:#15323E;
    --high:#E08479; --med:#D6A45C; --low:#7FBF9C;
  }}
  :root[data-theme="dark"]{
    --ground:#0F1211; --surface:#171B1A; --surface-2:#1F2523;
    --ink:#E9ECE7; --ink-2:#BAC2BE; --muted:#8B948F; --rule:#2B312F;
    --accent:#74B8D4; --accent-soft:#15323E;
    --high:#E08479; --med:#D6A45C; --low:#7FBF9C;
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding-inline:24px;padding-block:34px 64px;display:flex;flex-direction:column;gap:26px}

  header.head{display:flex;flex-direction:column;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:18px}
  .eyebrow{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0}
  h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,4vw,2.3rem);letter-spacing:-.022em;margin:0;line-height:1.05}
  .live{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--low);flex:none}
  .dot.demo{background:var(--med)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
  .tile{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:3px}
  .tile .k{font-family:var(--f-mono);font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .v.alarm{color:var(--high)}
  .tile .sub{font-size:.78rem;color:var(--muted)}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--surface)}
  .seg button{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;padding:7px 13px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--rule)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
  .seg button:hover:not([aria-pressed="true"]){background:var(--surface-2)}
  input[type="search"]{font-family:var(--f-mono);font-size:.78rem;padding:7px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink);min-width:190px;flex:1}
  .count{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:auto}

  .rows{display:flex;flex-direction:column;gap:10px}
  .row{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--muted);border-radius:3px;padding:15px 17px;display:flex;flex-direction:column;gap:9px}
  .row.high{border-left-color:var(--high)}
  .row.medium{border-left-color:var(--med)}
  .row.low{border-left-color:var(--low)}
  .row.done{opacity:.55}
  .row-top{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline}
  .flagid{font-family:var(--f-mono);font-weight:500;font-size:.82rem;letter-spacing:.02em}
  .row.high .flagid{color:var(--high)} .row.medium .flagid{color:var(--med)} .row.low .flagid{color:var(--low)}
  .where{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
  .delta{margin-left:auto;font-family:var(--f-display);font-weight:600;font-size:1.02rem;font-variant-numeric:tabular-nums}
  .delta.over{color:var(--high)} .delta.under{color:var(--accent)}
  .msg{margin:0;font-size:.96rem;color:var(--ink-2);max-width:76ch}
  .desc{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
  .facts{display:flex;flex-wrap:wrap;gap:6px}
  .fact{font-family:var(--f-mono);font-size:.7rem;padding:2px 7px;border-radius:2px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
  .fact b{font-weight:500;color:var(--muted)}
  .esc{background:var(--high);color:#fff}
  .row-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--rule);padding-top:9px}
  .fp{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
  .acts{margin-left:auto;display:flex;gap:6px}
  button.act{font-family:var(--f-mono);font-size:.71rem;padding:5px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink-2);cursor:pointer}
  button.act:hover{background:var(--surface-2);border-color:var(--muted)}
  button.act.primary{border-color:var(--accent);color:var(--accent)}
  button.act:disabled{opacity:.4;cursor:default}
  .resolution{font-size:.82rem;color:var(--muted);font-style:italic}
  .empty{background:var(--surface);border:1px dashed var(--rule);border-radius:3px;padding:40px 22px;text-align:center;color:var(--muted)}
  footer{border-top:1px solid var(--rule);padding-top:14px;font-size:.8rem;color:var(--muted);max-width:78ch}
  dialog{border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink);padding:0;max-width:440px;width:calc(100% - 32px)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg{padding:20px;display:flex;flex-direction:column;gap:13px}
  .dlg h2{font-family:var(--f-display);font-size:1.05rem;margin:0}
  .dlg label{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
  .dlg input,.dlg textarea{width:100%;font-family:var(--f-body);font-size:.92rem;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--ground);color:var(--ink)}
  .dlg textarea{min-height:64px;resize:vertical}
  .dlg .btns{display:flex;gap:8px;justify-content:flex-end}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:620px){.wrap{padding-block:24px 44px}.delta{margin-left:0}.acts{margin-left:0}}
</style>

<div class="wrap">
  <header class="head">
    <p class="eyebrow">AMZ Prep · buy-side invoice audit</p>
    <h1>Exception Queue</h1>
    <span class="live"><span class="dot" id="mode-dot"></span><span id="mode-label">live</span></span>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="bar">
    <div class="seg" role="group" aria-label="Filter">
      <button data-filter="open" aria-pressed="true">Open</button>
      <button data-filter="escalated" aria-pressed="false">Escalated</button>
      <button data-filter="all" aria-pressed="false">All</button>
    </div>
    <input type="search" id="q" placeholder="filter by flag, invoice, warehouse…" aria-label="Filter flags">
    <span class="count" id="count"></span>
  </div>

  <div class="rows" id="rows"></div>

  <footer id="foot"></footer>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg">
    <h2 id="dlg-title">Resolve flag</h2>
    <div>
      <label for="who">Who decided</label>
      <input id="who" name="who" required autocomplete="name">
    </div>
    <div>
      <label for="note">What happened</label>
      <textarea id="note" name="note" required placeholder="Credit CN-118 received, applied to September."></textarea>
    </div>
    <div class="btns">
      <button class="act" value="cancel">Cancel</button>
      <button class="act primary" id="dlg-ok" value="ok">Confirm</button>
    </div>
  </form>
</dialog>

<script>
const DATA = window.__QUEUE__ || {flags: [], meta: {}};
const LIVE = !!DATA.meta.live;
let filter = "open", search = "";
let pending = null;

const $ = (s) => document.querySelector(s);
const fmtMoney = (v, cur) => {
  const n = Number(v || 0), s = {USD:"$",GBP:"£",EUR:"€"}[cur] || (cur + " ");
  return (n < 0 ? "-" : "") + s + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
};

function visible(){
  return DATA.flags.filter(f => {
    if (filter === "open" && f.status !== "open") return false;
    if (filter === "escalated" && !(f.status === "open" && f.escalated)) return false;
    if (search){
      const hay = [f.flag,f.invoice_no,f.warehouse_id,f.client_id,f.line_description,f.message].join(" ").toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function renderTiles(){
  const open = DATA.flags.filter(f => f.status === "open");
  const esc = open.filter(f => f.escalated);
  const exposure = open.reduce((a,f) => a + Number(f.delta || 0), 0);
  const cur = DATA.flags[0]?.currency || "USD";
  const blocked = new Set(open.filter(f => f.flag === "UNKNOWN").map(f => f.invoice_no));
  $("#tiles").innerHTML = [
    ["open flags", open.length, ""],
    ["net exposure", fmtMoney(exposure, cur), exposure > 0 ? "over-billed to us" : ""],
    ["escalated", esc.length, esc.length ? `past ${DATA.meta.escalation_days||21} days` : "none overdue"],
    ["blocked invoices", blocked.size, blocked.size ? "cannot re-rate" : "none"],
  ].map(([k,v,sub],i) => `<div class="tile"><span class="k">${k}</span>
      <span class="v${i===2&&esc.length?" alarm":""}">${v}</span>
      ${sub?`<span class="sub">${sub}</span>`:""}</div>`).join("");
}

function rowHtml(f){
  const where = f.line_no ? `line ${f.line_no}` : "invoice";
  const dir = Number(f.delta) >= 0 ? "over" : "under";
  const facts = [];
  if (f.expected) facts.push(`<span class="fact"><b>expected</b> ${esc(f.expected)}</span>`);
  if (f.actual) facts.push(`<span class="fact"><b>found</b> ${esc(f.actual)}</span>`);
  if (f.rate_card_version) facts.push(`<span class="fact"><b>card</b> ${esc(f.rate_card_version)}</span>`);
  if (f.source_page) facts.push(`<span class="fact"><b>page</b> ${f.source_page}</span>`);
  facts.push(`<span class="fact"><b>age</b> ${f.age_days}d</span>`);
  if (f.escalated && f.status === "open") facts.push(`<span class="fact esc">escalated</span>`);
  return `<article class="row ${f.severity}${f.status!=="open"?" done":""}" data-fp="${f.fingerprint}">
    <div class="row-top">
      <span class="flagid">${f.flag}</span>
      <span class="where">${f.invoice_no} · ${where} · ${esc(f.warehouse_id)}→${esc(f.client_id)}</span>
      ${Number(f.delta) ? `<span class="delta ${dir}">${fmtMoney(Math.abs(Number(f.delta)), f.currency)} ${dir}</span>` : ""}
    </div>
    ${f.line_description?`<div class="desc">${esc(f.line_description)}</div>`:""}
    <p class="msg">${esc(f.message)}</p>
    <div class="facts">${facts.join("")}</div>
    <div class="row-foot">
      <span class="fp">${f.fingerprint.slice(0,8)}</span>
      ${f.resolution?`<span class="resolution">${f.status} by ${esc(f.resolved_by||"?")}: ${esc(f.resolution)}</span>`:""}
      <span class="acts">
        ${f.status === "open" ? `
          <button class="act primary" data-act="resolve">Resolve</button>
          <button class="act" data-act="dismiss">Dismiss</button>`
        : `<button class="act" data-act="reopen">Reopen</button>`}
      </span>
    </div>
  </article>`;
}
function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }

function render(){
  renderTiles();
  const rows = visible();
  $("#count").textContent = `${rows.length} shown`;
  $("#rows").innerHTML = rows.length
    ? rows.map(rowHtml).join("")
    : `<div class="empty">Nothing here. ${filter==="open"?"The queue is clear.":"Try a different filter."}</div>`;
  $("#mode-dot").className = "dot" + (LIVE ? "" : " demo");
  $("#mode-label").textContent = LIVE ? `live · ${DATA.meta.path||"flag store"}` : "read-only demo · sample data";
  $("#foot").textContent = LIVE
    ? `Resolving writes straight to ${DATA.meta.path}. Escalation at ${DATA.meta.escalation_days||21} days keeps flags inside the shortest dispute window.`
    : "Read-only preview with sample data. Run `invoice-audit serve --flags-db data/flags.json` for the live queue that writes resolutions back.";
}

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  filter = b.dataset.filter; render();
}));
$("#q").addEventListener("input", e => { search = e.target.value.trim().toLowerCase(); render(); });

$("#rows").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const fp = btn.closest(".row").dataset.fp;
  const act = btn.dataset.act;
  if (!LIVE){ alert("This is the read-only preview. Run the local server to resolve flags."); return; }
  if (act === "reopen") return send(fp, {action:"reopen"});
  pending = {fp, act};
  $("#dlg-title").textContent = act === "dismiss" ? "Dismiss flag" : "Resolve flag";
  $("#dlg-ok").textContent = act === "dismiss" ? "Dismiss" : "Resolve";
  $("#dlg").showModal();
});

$("#dlg").addEventListener("close", () => {
  if ($("#dlg").returnValue !== "ok" || !pending) { pending = null; return; }
  const who = $("#who").value.trim(), note = $("#note").value.trim();
  if (!who || !note) { pending = null; return; }
  send(pending.fp, {action: pending.act, by: who, note});
  $("#note").value = "";
  pending = null;
});

async function send(fp, body){
  try{
    const res = await fetch(`/api/flags/${fp}`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    const updated = await res.json();
    const i = DATA.flags.findIndex(f => f.fingerprint === updated.fingerprint);
    if (i >= 0) DATA.flags[i] = updated;
    render();
  } catch (err){
    alert("Could not save: " + err.message);
  }
}

render();
</script>
